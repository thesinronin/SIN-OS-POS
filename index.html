<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SIN-OS" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>EmberPOS — Hookah Lounge Table &amp; Order Manager</title>
    <meta
      name="description"
      content="Real-time multi-staff hookah lounge POS tracking seated tables, live session & coal timers, flavor mix orders, 2D floor layout editor across 2 floors and outside seating, and audio timer alerts."
    />
    <meta property="og:title" content="EmberPOS — Hookah Lounge Table & Order Manager" />
    <meta
      property="og:description"
      content="Track seated tables, live duration & coal rotation timers, shisha orders, and multi-floor layouts in real time."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Cinzel:wght@600;700;800;900&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @keyframes splashFadeIn {
        0% { opacity: 0; transform: scale(1.03); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes spin {
        100% { transform: rotate(360deg); }
      }
      .splash-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        background-color: #05040a;
        overflow: hidden;
      }
      .splash-bg-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        animation: splashFadeIn 0.8s ease-out forwards;
      }
      .splash-overlay-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: calc(36px + env(safe-area-inset-bottom, 0px));
        background: rgba(5, 4, 10, 0.78);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 12px 28px;
        border-radius: 9999px;
        border: 1px solid rgba(234, 179, 8, 0.45);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.85);
      }
      .splash-sub {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        color: #FBBF24;
        letter-spacing: 0.18em;
        text-shadow: 0 0 12px rgba(251, 191, 36, 0.5);
      }
      .splash-spinner {
        margin-top: 8px;
        width: 22px;
        height: 22px;
        border: 3px solid rgba(251, 191, 36, 0.25);
        border-top-color: #FBBF24;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
    </style>
  </head>
  <body class="bg-[#05070E] text-slate-100 antialiased selection:bg-cyan-400/30 selection:text-cyan-200">
    <div id="root">
      <div id="splash-loader" class="splash-container">
        <img src="splash-loading.png" alt="Southern Sands Hookah Loading" class="splash-bg-image" />
        <div class="splash-overlay-content">
          <div class="splash-sub">SOUTHERN SANDS HOOKAH · LOADING POS...</div>
          <div class="splash-spinner"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
